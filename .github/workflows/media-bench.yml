name: Media bench

on:
  push:
    branches: [arena/f3c901c7-yoyoi]
    paths:
      - 'bench/media_bench.sh'
      - '.github/workflows/media-bench.yml'
  workflow_dispatch:

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Jalankan uji media
        run: |
          bash bench/media_bench.sh > /tmp/out.txt 2>&1 || true
          cat /tmp/out.txt

      - name: Laporkan hasil (annotation)
        if: always()
        continue-on-error: true
        run: |
          tr '\n' '|' < /tmp/out.txt | sed 's/::/:/g' | cut -c1-3500 > /tmp/a
          echo "::error::MEDIA $(cat /tmp/a)"
