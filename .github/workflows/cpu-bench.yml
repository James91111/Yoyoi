name: CPU bench

on:
  push:
    branches: [arena/f3c901c7-yoyoi]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Jalankan semua benchmark
        run: |
          {
            echo "nproc=$(nproc)"
            echo "cpu=$(lscpu | sed -n 's/^Model name: *//p')"
            echo "threads_per_core=$(lscpu | sed -n 's/^Thread(s) per core: *//p')"
            echo "cores_per_socket=$(lscpu | sed -n 's/^Core(s) per socket: *//p')"
            echo "max_mhz=$(lscpu | sed -n 's/^CPU max MHz: *//p')"
            echo "mem=$(free -m | awk '/Mem:/{print $2"MB total"}')"
            echo "python=$(python3 -c 'import platform;print(platform.python_version())')"
          } > /tmp/info.txt
          cat /tmp/info.txt
          for n in 1 2 4; do
            python3 bench/cpu_bench.py $n | sed "s/^/${n}C: /"
          done > /tmp/bench.txt
          cat /tmp/bench.txt
          openssl speed -elapsed -evp aes-256-gcm 2>/dev/null | tail -3 > /tmp/aes.txt || true
          cat /tmp/aes.txt

      - name: Laporkan hasil (annotation)
        if: always()
        continue-on-error: true
        run: |
          pack() {
            tr '\n' '|' < "$1" | sed 's/::/:/g' | cut -c1-900
          }
          echo "::error::BENCH-INFO $(pack /tmp/info.txt)"
          echo "::error::BENCH-RESULT $(pack /tmp/bench.txt)"
          echo "::error::BENCH-AES $(pack /tmp/aes.txt)"
